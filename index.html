<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGE DRIP | Official Streetwear</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .hero h1 {
            font-size: 56px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 18px;
            color: #888;
            max-width: 600px;
            margin-bottom: 35px;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #888;
            color: #fff;
        }
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #1a1a1a;
            color: #444;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">EGE DRIP</div>
    </header>

    <main class="hero">
        <h1>Yeni Sezon Koleksiyonu</h1>
        <p>Sokak modasının en özel parçaları ve sınırlı sayıdaki drop'lar çok yakında burada.</p>
        <a href="#" class="btn">Koleksiyonu İncele</a>
    </main>

    <footer>
        <p>&copy; 2026 egeDrip. Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
