<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGE DRIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 20px 20px;
            text-align: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding-top: 10px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            margin: auto 0;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            word-wrap: break-word;
        }

        .description {
            font-size: 1rem;
            color: #b3b3b3;
            line-height: 1.5;
            margin-bottom: 35px;
            max-width: 400px;
            font-weight: 400;
        }

        .btn-koleksiyon {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 16px 36px;
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 4px;
            border: none;
        }

        footer {
            font-size: 0.8rem;
            color: #555555;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">EGE DRIP</div>
    </header>

    <div class="main-content">
        <h1 class="main-title">YENİ SEZON KOLEKSİYONU</h1>
        <p class="description">Sokak modasının en özel parçaları ve sınırlı sayıdaki drop'lar çok yakında burada.</p>
        <a href="#" class="btn-koleksiyon">KOLEKSİYONU İNCELE</a>
    </div>

    <footer>
        © 2026 egeDrip. Tüm hakları saklıdır.
    </footer>

</body>
</html>
