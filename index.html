<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGE DRIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0c0c0c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 20px 20px;
            text-align: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding-top: 10px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 500px;
            margin: auto 0;
        }

        .main-title {
            font-size: 2.7rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .description {
            font-size: 1rem;
            color: #999999;
            line-height: 1.5;
            margin-bottom: 35px;
            max-width: 360px;
            font-weight: 400;
        }

        .btn-koleksiyon {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 16px 36px;
            font-size: 0.9rem;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            border: none;
        }

        footer {
            font-size: 0.8rem;
            color: #444444;
            padding-bottom: 10px;
        } .hero-section {
  position: relative;
  width: 100%;
  height: 85vh;
  min-height: 500px;
  background-image: url('IMG_3618.jpeg');
  background-size: cover;
  background-position: center center;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #ffffff;
  font-family: sans-serif;
  overflow: hidden;
}

.hero-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    180deg, 
    rgba(0, 0, 0, 0.45) 0%, 
    rgba(0, 0, 0, 0.3) 50%, 
    rgba(0, 0, 0, 0.7) 100%
  );
  z-index: 1;
}

.hero-content {
  position: relative;
  z-index: 2;
  padding: 0 20px;
  max-width: 800px;
}

.hero-subtitle {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 4px;
  margin-bottom: 12px;
  color: #e0e0e0;
  text-transform: uppercase;
}

.hero-title {
  font-size: 48px;
  font-weight: 900;
  line-height: 1.05;
  text-transform: uppercase;
  margin-bottom: 16px;
  text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
}

.hero-title .highlight {
  font-style: italic;
  display: inline-block;
  margin-top: 5px;
}

.hero-discount {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin-bottom: 30px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
}

.hero-btn {
  display: inline-block;
  padding: 14px 40px;
  background-color: #ffffff;
  color: #000000;
  font-size: 15px;
  font-weight: 900;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: 4px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
}

.hero-btn:hover {
  background-color: #000000;
  color: #ffffff;
  transform: translateY(-2px);
}

@media (max-width: 768px) {
  .hero-section {
    height: 75vh;
  }
  .hero-title {
    font-size: 32px;
  }
  .hero-subtitle {
    font-size: 11px;
    letter-spacing: 2px;
  }
  .hero-discount {
    font-size: 13px;
  }
  .hero-btn {
    padding: 12px 30px;
    font-size: 13px;
  }
}

    </style>
</head>
<body>

    
        <header>
  <div class="logo">EGE DRIP</div>
</header>

         <section class="hero-section">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="hero-subtitle">NEW SEASON / 2026</p>
    <h1 class="hero-title">YENİ SEZON<br><span class="highlight">KOLEKSİYONU</span></h1>
    <p class="hero-discount">Sokak modasının en özel parçaları ve sınırlı sayıdaki drop'lar çok yakında burada.</p>
    <a href="#urunler" class="hero-btn">KOLEKSİYONU İNCELE</a>
  </div>
</section>


    <footer>
        © 2026 egeDrip. Tüm hakları saklıdır.
    </footer>

</body>
</html>
